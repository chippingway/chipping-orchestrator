version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
    labels:
      - "workflow:dependencies"
      - "workflow:github_actions"

  - package-ecosystem: pip
    directory: /
    versioning-strategy: increase
    schedule:
      interval: weekly
    cooldown:
      default-days: 30
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14
    allow:
      # Routine and security updates target direct dependencies.
      - dependency-type: direct
    labels:
      - "workflow:dependencies"
      - "workflow:python:pip"
