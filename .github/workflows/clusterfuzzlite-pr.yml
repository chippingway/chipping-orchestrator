name: ClusterFuzzLite PR fuzzing

# Fuzzes the revision a pull request would merge, a fork's included, from the
# committed seeds alone. `docs/configuration/operations.md` covers the budgets,
# the artifacts, and why no ClusterFuzzLite step is handed a token.
on:
  pull_request:

permissions:
  contents: read

# One lane per pull request: a second push cancels the run its earlier push
# started rather than leaving it fuzzing a revision nobody is reviewing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    # The build and fuzzing ceilings below, with room for the uploads; far
    # under GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      # The action clones this repository anonymously at the merge ref GitHub
      # tests for the pull request and builds `.clusterfuzzlite/Dockerfile`
      # from it. Both targets are kept: no coverage report is published to tell
      # which of them a change reaches.
      - name: Build the fuzz targets
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        timeout-minutes: 30
        with:
          language: python
          sanitizer: address
          keep-unaffected-fuzz-targets: true

      # The build action checks a pull request's merge ref out afresh, and that
      # ref moves with the base and the head, so a run fuzzes the commit it was
      # started for -- recorded here for replaying a finding -- or fails.
      - name: Check the fuzzed commit
        run: |
          built=$(git -c safe.directory='*' -C "storage/${GITHUB_REPOSITORY#*/}" rev-parse HEAD)
          if [ "$built" != "$GITHUB_SHA" ]; then
            echo "::error::the build checked out $built, not $GITHUB_SHA, the commit this run is for"
            exit 1
          fi
          echo "Fuzzed commit: $built" | tee -a "$GITHUB_STEP_SUMMARY"

      # No token: the action's own corpus and build downloads would take the
      # newest artifact of the name from any run, a fork's included, so they
      # fail closed and the run starts from the packaged seeds.
      - name: Fuzz the change
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        timeout-minutes: 20
        # The v1 action passes neither switch, and its runner reads an unset
        # REPORT_TIMEOUTS as false, which would let a hang pass green.
        env:
          REPORT_TIMEOUTS: "true"
          REPORT_OOMS: "true"
        with:
          language: python
          sanitizer: address
          mode: code-change
          fuzz-seconds: 600
          report-unreproducible-crashes: true
          dry-run: false

      - name: Keep the crashing inputs
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clusterfuzzlite-pr-findings-${{ github.run_attempt }}
          path: out/artifacts
          if-no-files-found: ignore
          retention-days: 14

  # The fuzz job's log -- the build, the packaged targets' checks, and
  # libFuzzer's coverage counters -- kept as an artifact on the same retention.
  log:
    needs: fuzz
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Copy the fuzz job's log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jobs="repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs"
          job=$(gh api "$jobs" --jq '.jobs[] | select(.name == "fuzz") | .id')
          # A finished job's log can take a few seconds to be served. Its
          # colored lines carry terminal escapes, which the GitHub CLI
          # refuses to print unless told; they go to a file, never a terminal.
          for _ in 1 2 3 4 5 6; do
            gh api --allow-escape-sequences "repos/$GITHUB_REPOSITORY/actions/jobs/$job/logs" > fuzz-job.log && exit 0
            sleep 10
          done
          exit 1

      - name: Keep the log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clusterfuzzlite-pr-log-${{ github.run_attempt }}
          path: fuzz-job.log
          retention-days: 14
