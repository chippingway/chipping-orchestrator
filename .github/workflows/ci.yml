name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request runs in one lane per ref and supersedes its own run on every
# push, so the older one is cancelled rather than left racing the new head for
# a runner and reporting a check against a commit nobody is reviewing.
# Everything else -- a push to `main` above all -- is keyed on the run id
# instead, so each such run is alone in its group. `cancel-in-progress: false`
# would not be enough: GitHub holds at most one pending run per group and
# cancels the one a newcomer replaces, so a third push to a shared group
# evicts the queued run while the first still holds the runner. A run on
# `main` is the record of what that commit does, and no later push may erase
# it, waiting or started.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    # Generous next to the few minutes a green run takes, and far under the
    # six-hour default GitHub would otherwise cancel at: this job is a required
    # check, so a hung one holds a merge for those six hours instead of failing
    # in the minutes the suite needs.
    timeout-minutes: 20
    strategy:
      # All interpreters report. A failure on one is a fact about that
      # version, not a reason to stop learning what the others do.
      fail-fast: false
      matrix:
        # The versions a run proves. `requires-python` sets a floor of
        # 3.12 and no ceiling, so a later release installs untested.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        run: pipx install "poetry==2.5.1"

      # Use the interpreter setup-python placed on PATH so every matrix leg
      # proves the version it names, even when the runner has other Pythons.
      - name: Select the matrix interpreter
        run: poetry env use "$(command -v python)"

      - name: Check the lockfile
        run: poetry check --lock

      - name: Install from lock
        run: poetry sync --no-interaction

      - name: Lint (ruff)
        run: poetry run ruff check orchestrator tests .github/scripts/docs_site.py

      - name: Lint (wemake-python-styleguide)
        run: poetry run flake8 orchestrator tests .github/scripts/docs_site.py --select=WPS

      - name: Tests (pytest)
        run: poetry run python -m pytest tests --cov=orchestrator --cov-report=term-missing

      - name: Build distributions
        run: poetry build

      # The sync above installs this project into `.venv` editable, so every
      # step before this one reaches the console script through the source
      # tree and none of them read what the build backend packaged. This one
      # reads only that: each artifact, in an environment holding it and the
      # dependencies it declares and nothing else -- no project, no lockfile,
      # no dev group. An artifact shipping no `orchestrator` package, an entry
      # point naming a module it does not carry, or a runtime dependency the
      # lockfile supplies but `[project.dependencies]` omits fails here and
      # passes every step above.
      - name: Smoke-test the built wheel
        run: |
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-env/bin/chipping-orchestrator" --help

      # Poetry builds the wheel from the checkout, so installing the sdist
      # independently is what detects a file omitted from the source archive.
      - name: Smoke-test the built sdist
        run: |
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/python" -m pip install dist/*.tar.gz
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/sdist-env/bin/chipping-orchestrator" --help
