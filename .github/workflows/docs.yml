name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/scripts/docs_site.py"
      - ".github/docs-theme/**"
      - ".github/workflows/docs.yml"
      - "tests/repository/*doc*"
      - "pyproject.toml"
      - "uv.lock"
      - "README.md"
      - "SECURITY.md"
      - "AGENTS.md"
      - ".agents/skills/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
    'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"

      - name: Install from lock
        run: uv sync --locked --group docs --python 3.12

      - name: Lint documentation hooks
        run: |
          uv run --no-sync ruff check .github/scripts/docs_site.py
          uv run --no-sync flake8 .github/scripts/docs_site.py --select=WPS

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Check the built documentation
        env:
          DOCS_SITE_DIR: site
        run: >-
          uv run --no-sync pytest tests/repository/test_docs_site.py tests/repository/test_docs_output.py
          tests/repository/test_docs_navigation.py

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
