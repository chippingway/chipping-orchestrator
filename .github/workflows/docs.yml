name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/scripts/docs_site.py"
      - ".github/docs-theme/**"
      - ".github/workflows/docs.yml"
      - "tests/repository/*doc*"
      - "pyproject.toml"
      - "poetry.lock"
      - "poetry.toml"
      - "README.md"
      - "SECURITY.md"
      - "AGENTS.md"
      - ".agents/skills/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' &&
    'pages' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install "poetry==2.5.1"

      - name: Select the interpreter
        run: poetry env use "$(command -v python)"

      - name: Check the lockfile
        run: poetry check --lock

      - name: Install from lock
        run: poetry sync --with docs --no-interaction

      - name: Lint documentation hooks
        run: |
          poetry run ruff check .github/scripts/docs_site.py
          poetry run flake8 .github/scripts/docs_site.py --select=WPS

      - name: Build documentation
        run: poetry run mkdocs build --strict

      - name: Check the built documentation
        env:
          DOCS_SITE_DIR: site
        run: >-
          poetry run pytest tests/repository/test_docs_site.py tests/repository/test_docs_output.py
          tests/repository/test_docs_navigation.py

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
