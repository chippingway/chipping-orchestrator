[project]
name = "chipping-orchestrator"
version = "0.12.0"
description = "GitHub-Issue-driven AI agent workflow."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["PyGithub>=2.1", "psycopg[binary]>=3.3.4"]

[project.scripts]
chipping-orchestrator = "orchestrator.cli:main"

# A console script is only installed for a built project, so the flat-layout
# `orchestrator` package is declared explicitly here; auto-discovery would
# otherwise trip over the sibling `tests`/`docs` directories.
[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-cov>=7.1.0", "ruff>=0.16.3", "wemake-python-styleguide>=1.7.1"]
# Streamlit, Plotly, and Streamlit's transitive pandas are only needed
# by the analytics dashboard (`orchestrator/apps/analytics_dashboard.py`
# and the chart owners under
# `orchestrator/observability/dashboard/charts/`). They are NOT in
# the default `dev` group so `uv sync --locked` keeps installing the
# orchestrator's runtime + tests minimal; install with
# `uv sync --group dashboard` before running
# `uv run streamlit run orchestrator/apps/analytics_dashboard.py`.
dashboard = ["streamlit>=1.61.1", "plotly>=6.9.0"]

[tool.pytest.ini_options]
# Surface skip reasons in the run summary by default. The suite carries
# optional checks -- Plotly dashboard charts, Docker Compose configuration,
# and opt-in live-Postgres analytics integration -- which otherwise collapse
# to a bare "N skipped" under the default `pytest` invocation, hiding their
# `_SKIP_REASON` / `SkipTest` messages.
# The --ignore keeps a bare `pytest` from recursing into the operator-owned
# `analytics-db/data/` Docker bind mount, which may be unreadable and would
# otherwise abort collection with a PermissionError on a phantom conftest.py.
addopts = ["-rs", "--ignore=analytics-db/data"]
# Restrict default discovery to the tracked test tree so bare `pytest` and
# `pytest tests` collect the same inventory without probing runtime volumes.
testpaths = ["tests"]

[tool.ruff]
# Repository-wide line-length target. Ruff enforces it for Python (E501,
# enabled below); `tests/repository/test_line_length.py` reads this same value to
# enforce it for tracked Markdown/text files, so 120 lives in one place.
line-length = 120

[tool.ruff.lint]
# No `select` here on purpose: the contract is Ruff's own default rule set --
# whatever the `ruff` version resolved in `uv.lock` ships -- plus the one rule
# opted into below. The `ruff>=` in `[dependency-groups]` above names a floor
# and not a version, so the lockfile is what settles the rule set and a
# regenerated lock is what moves it. A `select` here would be a copy of those
# defaults taken on the day it was written, and a copy cannot follow them:
# every rule the tool adds afterwards stays off, unreported, and unanswered.
#
# E501 (line too long) is the one rule the defaults leave out that this repo
# wants: opting into it is what enforces the line-length target above.
extend-select = ["E501"]
# The one rule a `# noqa` in this tree names that the default set does not
# enable: N802 on the single test double that mimics a third-party method
# name. Naming it keeps RUF100 -- which the default set does enable -- from
# reading that directive as dead, and leaves it live for the audit it was
# written for, `ruff check orchestrator tests --select=N802`. Every other rule
# a directive names is one the run enables itself, so it earns no entry here.
external = ["N802"]

# PLC0414 (`import X as X`) is in the default set, so these entries answer the
# run itself rather than an audit beside it. The rule stands against the
# convention F401 is answered with here: a same-name alias is what declares an
# import an explicit re-export, and the import that drops it is what F401
# reports as dead. Each path below is a module whose job is to bind names it
# does not itself read -- the theme a dashboard page hands every panel, and the
# stage fixtures a sibling test module reaches its scenario types through -- so
# every alias in it is load-bearing. Exact paths rather than a glob, so a
# neighbouring or future module is still held to the rule: an alias on a name
# its own module already reads earns no F401 exemption and is removed instead.
[tool.ruff.lint.per-file-ignores]
"orchestrator/observability/dashboard/theme.py" = ["PLC0414"]
"tests/workflow/stages/conflicts/conflict_resume_test_support.py" = ["PLC0414"]
"tests/workflow/stages/conflicts/content_update_support.py" = ["PLC0414"]
"tests/workflow/stages/decomposition/late_run_support.py" = ["PLC0414"]
"tests/workflow/stages/fixing/published_gate_support.py" = ["PLC0414"]
"tests/workflow/stages/validating/recovered_gate_support.py" = ["PLC0414"]

# I001 (unsorted imports) is in the default set too, so the run reads every
# import block and this setting is what says how they are spelled. Ruff's
# default splits an aliased member onto an import statement of its own, which
# turns the one statement a module is read through into as many statements as
# it has aliases; the tree's modules read most of their neighbours under an
# alias, so the default would push whole files past the ceiling WPS201 holds
# them to. Combining keeps every member a module is read for on the single
# statement that names it.
[tool.ruff.lint.isort]
combine-as-imports = true
