site_name: chipping-orchestrator
site_description: GitHub issue to reviewed pull request automation with local AI coding agents.
site_url: https://chippingway.github.io/chipping-orchestrator/
repo_url: https://github.com/chippingway/chipping-orchestrator
repo_name: chippingway/chipping-orchestrator
edit_uri: ""

theme:
  name: mkdocs
  custom_dir: .github/docs-theme
  color_mode: auto
  user_color_mode_toggle: true
  navigation_depth: 3

hooks:
  - .github/scripts/docs_site.py

markdown_extensions:
  - toc:
      permalink: true

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

nav:
  - Home: README.md
  - Operate:
      - Quick start: https://github.com/chippingway/chipping-orchestrator/blob/main/README.md#quick-start
      - Settings: configuration.md
      - Operations: configuration/operations.md
      - Snapshot capability check: configuration/snapshot-capability-check.md
      - Security: security.md
  - How it works:
      - Architecture:
          - Overview: architecture.md
          - Platform modules: architecture/platform-modules.md
          - Workflow modules: architecture/workflow-modules.md
          - Observability modules: architecture/observability-modules.md
      - State machine:
          - Overview: state-machine.md
          - Labels and state: state-machine/labels-and-state.md
          - Delivery stages: state-machine/delivery-stages.md
          - Conversation stages: state-machine/conversation-stages.md
          - Lifecycle: state-machine/lifecycle.md
      - Agents:
          - Overview: workflow.md
          - Agent roles: workflow/roles.md
          - Conversations: workflow/conversations.md
          - Command specs: workflow/command-specs.md
  - Observability:
      - Overview: observability.md
      - Settings: configuration/observability.md
      - Event streams: observability/event-streams.md
      - Trajectories: observability/trajectories.md
      - Analytics database: observability/analytics-database.md
      - Analytics dashboard: observability/analytics-dashboard.md
      - Usage parser: observability/usage.md
  - Releases: release-timeline.md
